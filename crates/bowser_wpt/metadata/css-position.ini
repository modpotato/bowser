# and (b) geometry getters don't force a sync reflow, so the task reads
# pre-script state. nested_offsets delivery itself is fine. Follow-up:
# pending-offset stash in ElementScrollStates + dirty-checked sync layout
# in geometry getters (app/bindings driver work, not layout).

